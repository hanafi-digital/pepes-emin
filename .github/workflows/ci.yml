name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Validate JSON-LD
        run: npm run validate:jsonld

      - name: Lighthouse CI
        # audit:lh builds again, starts the preview server (which correctly
        # serves the configured /pepes-emin base path — lhci's own
        # staticDistDir server serves dist/ at the root instead, so every
        # asset 404s and Lighthouse scores the resulting broken page, not
        # the real site), runs lhci against it, then stops the server.
        run: npm run audit:lh
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          echo "## Lighthouse CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .lighthouseci/links.json ]; then
            echo "Reports:" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const links = require('./.lighthouseci/links.json');
              for (const [url, link] of Object.entries(links)) {
                console.log('- [' + url + '](' + link + ')');
              }
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Lighthouse report links were produced (see the Lighthouse CI step log)." >> "$GITHUB_STEP_SUMMARY"
          fi
